<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .bg-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card { animation: float 4s ease-in-out infinite; }
    .moving-route { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic Animated Ambient Glows (Background) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" class="bg-pulse" />
  <circle cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.12" class="bg-pulse" />

  <!-- Decorative Grid Lines (Background) -->
  <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3" />
  <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Animated Route Line (Visual Accent Background) -->
  <path d="M 100 240 Q 300 280 500 220 T 900 260 T 1150 180" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" class="moving-route" />

  <!-- Content Container / Main Foregrounds (Ensures title/subtitle never covered) -->
  <g transform="translate(60, 0)">
    <!-- Header Badge -->
    <g transform="translate(0, 50)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" class="badge-text" fill="#64748b">⚡ FIELD SERVICE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title">
      Awesome <tspan fill="url(#accent-grad)">Dispatch</tspan> Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">
      Curated List of SaaS Products, Open-Source Engines &amp; Field Operations Solutions 🚛⚡
    </text>

    <!-- Stat Pills (Foreground) -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" />
      <text x="16" y="26" font-family="system-ui" font-weight="700" font-size="16" fill="#6366f1">10+ SaaS</text>
      <text x="92" y="26" font-family="system-ui" font-weight="500" font-size="12" fill="#94a3b8">Leaders</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" />
      <text x="191" y="26" font-family="system-ui" font-weight="700" font-size="16" fill="#10b981">10+ Open Source</text>
      <text x="315" y="26" font-family="system-ui" font-weight="500" font-size="12" fill="#94a3b8">Repos</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="180" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" />
      <text x="386" y="26" font-family="system-ui" font-weight="700" font-size="16" fill="#ec4899">~$6.5B Market</text>
      <text x="500" y="26" font-family="system-ui" font-weight="500" font-size="12" fill="#94a3b8">Size</text>
    </g>
  </g>

  <!-- Decorative Graphical Accent on Right (Background Side Graphic) -->
  <g transform="translate(920, 60)" class="floating-card" opacity="0.85">
    <rect width="220" height="180" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Mini UI Mockup -->
    <rect x="15" y="15" width="190" height="12" rx="4" fill="#334155" />
    <rect x="15" y="35" width="120" height="8" rx="3" fill="#475569" />
    <rect x="15" y="55" width="190" height="35" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <circle cx="35" cy="72.5" r="8" fill="#6366f1" />
    <rect x="52" y="68" width="80" height="9" rx="3" fill="#e2e8f0" />
    <rect x="15" y="100" width="190" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <circle cx="35" cy="117.5" r="8" fill="#10b981" />
    <rect x="52" y="113" width="100" height="9" rx="3" fill="#e2e8f0" />
    <rect x="15" y="145" width="70" height="20" rx="6" fill="#8b5cf6" />
    <text x="50" y="159" font-family="system-ui" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">ACTIVE</text>
  </g>
</svg>
